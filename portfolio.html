<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio - Alex Kameni</title>
    <meta name="description" content="Featured AI and machine learning projects by Alex Kameni">
    
    <!-- Favicons -->
    <link rel="icon" type="image/x-icon" href="images/favicon.ico">
    <link rel="apple-touch-icon" href="images/alex.png">
    
    <!-- External CSS -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Minimal Custom CSS -->
    <style>
        :root { --primary-color: #4f46e5; --secondary-color: #f59e0b; }
        html { scroll-behavior: smooth; scroll-padding-top: 80px; }
        #loading-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, var(--primary-color), #3730a3);
            display: flex; align-items: center; justify-content: center;
            z-index: 9999; transition: opacity 0.5s ease;
        }
        #loading-screen.hidden { opacity: 0; visibility: hidden; }
        .brain-animation { font-size: 3rem; animation: pulse 2s infinite; }
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.7; }
        }
    </style>
</head>
<body>
    <!-- Loading Screen -->
    <div id="loading-screen">
        <div class="loader">
            <div class="brain-animation">
                <i class="fas fa-brain"></i>
            </div>
            <p>Loading Portfolio...</p>
        </div>
    </div>

    <!-- Navigation -->
    <div id="navigation-container"></div>

    <!-- Page Header -->
    <section class="page-header">
        <div class="container">
            <h1>Portfolio</h1>
            <p>Innovative AI solutions and research projects</p>
            <nav class="breadcrumb">
                <a href="index.html">Home</a>
                <span>/</span>
                <span>Portfolio</span>
            </nav>
        </div>
    </section>

    <!-- Portfolio Section -->
    <div id="portfolio-container"></div>

    <!-- Footer -->
    <div id="footer-container"></div>

    <!-- Back to Top Button -->
    <button class="back-to-top" id="back-to-top" aria-label="Back to top">
        <i class="fas fa-chevron-up"></i>
    </button>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"></script>
    <script type="module" src="scripts/portfolio-app.js"></script>
</body>
</html>
