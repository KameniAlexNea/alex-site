<section id="contact" class="py-5 bg-light">
    <div class="container">
        <div class="text-center mb-5">
            <h2 class="display-5 fw-bold text-primary position-relative d-inline-block">
                Let's Connect
                <div class="position-absolute bottom-0 start-50 translate-middle-x" style="width: 50px; height: 3px; background: linear-gradient(90deg, #4f46e5, #f59e0b); border-radius: 2px;"></div>
            </h2>
            <p class="lead text-muted mt-3">Ready to collaborate on innovative AI projects</p>
        </div>
        
        <div class="row">
            <div class="col-lg-6 mb-4">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <div class="card border-0 shadow-sm h-100">
                            <div class="card-body text-center">
                                <i class="fas fa-envelope fa-2x text-primary mb-3"></i>
                                <h5>Email</h5>
                                <a href="mailto:kamenialexnea@gmail.com" class="text-decoration-none">kamenialexnea@gmail.com</a>
                            </div>
                        </div>
                    </div>
                    
                    <div class="col-md-6 mb-3">
                        <div class="card border-0 shadow-sm h-100">
                            <div class="card-body text-center">
                                <i class="fab fa-github fa-2x text-primary mb-3"></i>
                                <h5>GitHub</h5>
                                <a href="https://github.com/KameniAlexNea" target="_blank" class="text-decoration-none">@KameniAlexNea</a>
                            </div>
                        </div>
                    </div>
                    
                    <div class="col-md-6 mb-3">
                        <div class="card border-0 shadow-sm h-100">
                            <div class="card-body text-center">
                                <i class="fab fa-linkedin fa-2x text-primary mb-3"></i>
                                <h5>LinkedIn</h5>
                                <a href="https://linkedin.com/in/elie-alex-kameni-ngangue/" target="_blank" class="text-decoration-none">Alex Kameni</a>
                            </div>
                        </div>
                    </div>
                    
                    <div class="col-md-6 mb-3">
                        <div class="card border-0 shadow-sm h-100">
                            <div class="card-body text-center">
                                <i class="fab fa-twitter fa-2x text-primary mb-3"></i>
                                <h5>Twitter</h5>
                                <a href="https://twitter.com/kamenialexnea19" target="_blank" class="text-decoration-none">@kamenialexnea19</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="col-lg-6">
                <div class="card border-0 shadow">
                    <div class="card-body">
                        <form id="contact-form">
                            <div class="mb-3">
                                <label for="name" class="form-label">Name</label>
                                <input type="text" class="form-control" id="name" name="name" required>
                            </div>
                            
                            <div class="mb-3">
                                <label for="email" class="form-label">Email</label>
                                <input type="email" class="form-control" id="email" name="email" required>
                            </div>
                            
                            <div class="mb-3">
                                <label for="subject" class="form-label">Subject</label>
                                <input type="text" class="form-control" id="subject" name="subject" required>
                            </div>
                            
                            <div class="mb-3">
                                <label for="message" class="form-label">Message</label>
                                <textarea class="form-control" id="message" name="message" rows="5" required></textarea>
                            </div>
                            
                            <button type="submit" class="btn btn-primary btn-lg w-100">
                                <i class="fas fa-paper-plane me-2"></i>
                                Send Message
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
